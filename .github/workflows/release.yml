name: package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 37
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify sources
        run: ./gradlew :app:test :app:lintDebug :app:assembleDebugAndroidTest --console=plain

      - name: Prepare original signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: python scripts/ci_package.py prepare-signing

      - name: Build signed release
        run: ./gradlew :app:assembleRelease --no-configuration-cache --console=plain

      - name: Verify and collect packages
        run: python scripts/ci_package.py collect --build-tools "$ANDROID_HOME/build-tools/37.0.0"

      - name: Remove temporary signing files
        if: always()
        run: python scripts/ci_package.py cleanup-signing

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: signed-packages
          if-no-files-found: error
          path: |
            dist/*.apk
            dist/*-source.zip
            dist/SHA256SUMS.txt
            dist/build-info.json

      - name: Publish private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_package.py publish

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            app/build/reports/lint-results-debug.html
            app/build/test-results/**
