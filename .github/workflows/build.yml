name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already ships the Android SDK. Do not use
      # android-actions/setup-android here: it runs `sdkmanager tools`, and that
      # package no longer exists in the repository, so the step fails on its own.
      # API 37 is published as `platforms;android-37.0`, not `platforms;android-37`.
      - name: Install platform 37
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:test --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      # Debug build only: the release variant needs the private signing key, which is
      # never committed, so CI never produces a distributable APK.
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Assemble Android smoke tests
        run: ./gradlew :app:assembleDebugAndroidTest --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/test-results/**
          if-no-files-found: ignore
